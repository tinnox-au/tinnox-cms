# One server of a deployed environment (docs/deployment-plan-2026-11-24.md, section 3.2):
# the edge, the API and the media worker. The database and the identity provider are
# managed services and are not here. Local development keeps infra/docker-compose.yml.
#
#   docker compose --env-file /etc/tinnox/deploy.env -f infra/deploy/compose.yml up -d
#
# deploy.env names the three images, the two hostnames and the API's settings file.
# It holds no secret. The API's settings file does, and only the api service reads it.
name: tinnox-cms-deploy

services:
  edge:
    image: ${WEB_IMAGE:?}
    restart: unless-stopped
    read_only: true
    user: '10003:10003'
    cap_drop:
      - ALL
    # The caddy binary carries this file capability, so the kernel refuses to start it
    # without. It listens on 8080 and 8443 and needs it for nothing.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    environment:
      PORTAL_HOST: ${PORTAL_HOST:?}
      PLAYER_HOST: ${PLAYER_HOST:?}
    ports:
      - '${HTTP_BIND:-0.0.0.0:80}:8080'
      - '${HTTPS_BIND:-0.0.0.0:443}:8443'
    volumes:
      # Certificates and their keys. Losing it means new certificates, nothing else.
      - edge_data:/data
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=8m,uid=10003,gid=10003
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      edge:
        ipv4_address: 172.30.0.2
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    read_only: true
    user: '10002:10002'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    init: true
    stop_grace_period: 20s
    env_file:
      - ${API_ENV_FILE:?}
    environment:
      # The edge is the only proxy, at a fixed address, so the API believes its
      # X-Forwarded-For and nobody else's (config.ts refuses TRUST_PROXY=true).
      TRUST_PROXY: 172.30.0.2
    volumes:
      - media:/data/media
      # The API creates inbox and outbox here with the modes the worker needs.
      - jobs:/data/jobs
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks:
      edge:
        # Fixed too, so it can never be handed the edge's address.
        ipv4_address: 172.30.0.3

  # Same limits as in infra/docker-compose.yml: no network, no secret, read-only.
  media-worker:
    image: ${WORKER_IMAGE:?}
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: '10001:10001'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    init: true
    stop_grace_period: 5s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    environment:
      MEDIA_JOBS_DIR: /jobs
      NODE_ENV: production
    volumes:
      - jobs:/jobs:rw
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'test -n "$(find /jobs/outbox/.worker-alive -mmin -1 2>/dev/null)"']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/29

volumes:
  edge_data:
  media:
  jobs:
